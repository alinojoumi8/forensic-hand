[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forensic-hand"
version = "0.1.0"
description = "Local-first sealed intake for forensic document examination. Decision support for a human examiner. Not a verdict tool."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "pikepdf>=8",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyhanko>=0.25",
]

[project.scripts]
fhand = "forensic_hand.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forensic_hand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The temp folder stays inside the project, so that a locked system temp folder cannot stop the tests.
addopts = "-q --basetemp=.pytest_tmp"
markers = [
    "network: sends one hash to a real time stamp server (run with FHAND_NETWORK=1)",
]

[tool.coverage.run]
source = ["forensic_hand"]

[tool.ruff]
line-length = 110
